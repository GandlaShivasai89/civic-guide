<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicGuide AI – Government Process Assistant</title>
  <meta name="description" content="Easy-to-use platform helping citizens understand Indian government services, documentation checklists, statutory fees, and verified official portals.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230f2744'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- React 18 Root Application Container -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
      <div style="width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #0f2744; border-radius: 50%; animation: civicSpin 0.8s linear infinite;"></div>
      <h2 style="margin-top: 20px; color: #0f2744; font-size: 20px; font-weight: 800; letter-spacing: -0.5px;">CivicGuide AI</h2>
      <p style="color: #64748b; font-size: 14px; margin-top: 6px;">Loading verified official government process assistant...</p>
    </div>
  </div>

  <style>
    @keyframes civicSpin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- React 18 Production Runtime Scripts -->
  <script src="/static/js/vendor/react.min.js"></script>
  <script src="/static/js/vendor/react-dom.min.js"></script>

  <!-- Mount React CivicGuide Application with Rich Civic Graphics -->
  <script type="module">
    import { CivicApp } from '/static/js/react_app.compiled.js';
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(CivicApp));
  </script>
</body>
</html>
